<body>
<style>
/* Layout : une colonne ; accueil = les 3 parties du cours IA ; chaque session = 3 jeux + fiches ; barre du haut fixe pour revenir et ouvrir les fiches. */
:root{
  --bg:#fff8f0; --surface:#FFFFFF; --ink:#14123b; --muted:#5c5a7a; --line:#f1e2cf;
  --accent:#e9780a; --on-accent:#FFFFFF; --accent-soft:#fff0dc;
  --yes:#0E8A5F; --yes-bg:#DDF3EA; --no:#C8402F; --no-bg:#FBE4DF; --gold:#B7791F; --gold-bg:#FBF0DC;
  --display:"Plus Jakarta Sans","Trebuchet MS",sans-serif;
  --body:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0f0d1f; --surface:#1a1733; --ink:#ece9ff; --muted:#a7a3c9; --line:#2d2850;
  --accent:#ffa53a; --on-accent:#1a1206; --accent-soft:#3a2a17;
  --yes:#3CCB95; --yes-bg:#12352B; --no:#FF8370; --no-bg:#40201C; --gold:#E5B455; --gold-bg:#3A2E16; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0f0d1f; --surface:#1a1733; --ink:#ece9ff; --muted:#a7a3c9; --line:#2d2850;
  --accent:#ffa53a; --on-accent:#1a1206; --accent-soft:#3a2a17;
  --yes:#3CCB95; --yes-bg:#12352B; --no:#FF8370; --no-bg:#40201C; --gold:#E5B455; --gold-bg:#3A2E16; color-scheme:dark }

body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;
  -webkit-tap-highlight-color:transparent;touch-action:manipulation}
button{user-select:none;-webkit-user-select:none}
.wrap{max-width:760px;margin:0 auto;padding-block:16px 48px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.15}
h1{font-size:clamp(1.8rem,6vw,2.5rem);font-weight:700;letter-spacing:-.02em}
h2{font-size:1.4rem;font-weight:700} h3{font-size:1.05rem;font-weight:500}
p{margin:0}
.oui{color:var(--yes)} .non{color:var(--no)} .muted{color:var(--muted)} .small{font-size:.9rem}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.eyebrow{font-size:.75rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:12px}
.link{background:none;border:0;color:var(--accent);font:inherit;font-weight:600;cursor:pointer;padding:6px 2px}
.pill{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font:inherit;color:var(--ink);cursor:pointer;font-weight:600}
.pill:hover{border-color:var(--accent);color:var(--accent)}
.btn{background:var(--accent);color:var(--on-accent);border:0;border-radius:10px;padding:12px 20px;font:inherit;font-weight:600;cursor:pointer;align-self:flex-start}
.btn:hover{filter:brightness(1.08)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.sess{display:flex;flex-direction:column;gap:10px}
.scard{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;
  padding:14px 16px;font:inherit;color:inherit;cursor:pointer;transition:transform .15s,border-color .15s}
.scard:hover{border-color:var(--accent);transform:translateX(3px)}
.scard .num{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font-family:var(--mono);font-weight:700;font-size:1.1rem}
.scard .tx{min-width:0;display:flex;flex-direction:column;gap:2px}
.scard b{font-family:var(--display);font-size:1.15rem;line-height:1.2}
.dots{display:flex;gap:6px}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--gold)}
.game{display:flex;gap:14px;align-items:center;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;
  padding:16px;font:inherit;color:inherit;cursor:pointer;transition:transform .15s,border-color .15s}
.game:hover{border-color:var(--accent);transform:translateY(-2px)}
.game:disabled{opacity:.45;cursor:not-allowed;transform:none}
.game .g{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.game .g b{font-family:var(--display);font-size:1.2rem}
.game .rec{flex:none;text-align:right;font-size:.82rem;color:var(--muted)}
.game .rec b{display:block;font-family:var(--mono);font-size:1.05rem;color:var(--gold)}
.tag{flex:none;width:52px;height:52px;border-radius:12px;display:grid;place-items:center;font-family:var(--mono);font-weight:700;font-size:.8rem}
.tag.a{background:var(--yes-bg);color:var(--yes)} .tag.b{background:var(--accent-soft);color:var(--accent)} .tag.c{background:var(--no-bg);color:var(--no)} .tag.d{background:var(--gold-bg);color:var(--gold)}

.prog{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent)}
.hud{display:flex;gap:18px;flex-wrap:wrap;align-items:baseline}
.hud b{font-family:var(--mono);font-size:1.25rem}
.card{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:28px 20px;min-height:150px;display:grid;place-items:center;text-align:center;
  font-family:var(--display);font-size:1.35rem;font-weight:500;line-height:1.3;text-wrap:balance}
.vf{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.vf button{border:0;border-radius:14px;padding:18px 10px;font-family:var(--display);font-size:1.3rem;font-weight:700;cursor:pointer}
.vf .f{background:var(--no-bg);color:var(--no)} .vf .v{background:var(--yes-bg);color:var(--yes)}
.fb{border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.fb.ok{background:var(--yes-bg)} .fb.ko{background:var(--no-bg)} .fb.ne{background:var(--accent-soft)}
.fb .res{font-family:var(--mono);font-weight:700} .fb.ok .res{color:var(--yes)} .fb.ko .res{color:var(--no)} .fb.ne .res{color:var(--accent)}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:8px 14px;font:inherit;font-weight:600;color:var(--ink);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.chip:disabled{opacity:.4;text-decoration:line-through;cursor:default}
.def{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font:inherit;color:inherit;cursor:pointer}
.def:not(:disabled):hover{border-color:var(--accent)}
.def.done{background:var(--yes-bg);border-color:var(--yes);cursor:default}
.def.bad{background:var(--no-bg);border-color:var(--no)}
.def b{color:var(--yes)}

.mkt{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mkt div{border-radius:12px;padding:12px;text-align:center;font-weight:600}
.mkt .o{background:var(--yes-bg);color:var(--yes)} .mkt .n{background:var(--no-bg);color:var(--no)} .mkt .z{background:var(--accent-soft);color:var(--accent)}
.mkt b{display:block;font-family:var(--mono);font-size:1.45rem;overflow-wrap:anywhere}
.choice{display:flex;justify-content:space-between;gap:12px;align-items:center;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);
  border-radius:12px;padding:14px;font:inherit;font-weight:600;color:inherit;cursor:pointer}
.choice:hover{border-color:var(--accent)}
.choice span{font-family:var(--mono);font-weight:500;font-size:.85rem;color:var(--muted);flex:none}
.big{font-family:var(--mono);font-size:2.3rem;font-weight:700;line-height:1}
.row{display:flex;gap:24px;flex-wrap:wrap;align-items:flex-end}
.line{display:flex;justify-content:space-between;gap:12px;border-top:1px solid var(--line);padding-top:10px}
.line>span:first-child{min-width:0}
.miss{border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:2px;font-size:.94rem}
input.search{width:100%;box-sizing:border-box;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit}
.fiche{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
@media (min-width:700px){ body{font-size:17px} .card{font-size:1.55rem;min-height:180px} .vf button{padding:24px 10px;font-size:1.5rem} .choice,.def{padding:16px} .chip{padding:11px 18px} }
@media (prefers-reduced-motion: reduce){*{transition:none!important}}

/* Style La Chaîne des Quiz (violet et orange) */
h1{letter-spacing:-.03em;font-weight:800}
.panel,.game,.scard{border-radius:22px!important;box-shadow:0 14px 34px -26px rgba(200,110,10,.5)}
.btn{border-radius:999px!important;box-shadow:0 10px 22px -12px var(--accent)}
.scard .num{border-radius:14px;background:linear-gradient(150deg,#ffb547,var(--accent));color:#fff}
.prog i,.prog>*{background:linear-gradient(90deg,#ff9214,#5b3df5)}
</style>

<div class="wrap">
  <div class="bar">
    <button class="link" data-act="home" id="crumb" style="padding-left:0">Arcade-IA</button>
    <span style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="pill" data-act="snd" id="sbtn">Son : oui</button>
      <button class="pill" data-act="fiches" id="fbtn">Fiches</button>
    </span>
  </div>
  <main id="app" class="stack"></main>
</div>

sim:{name:"Le Labo", tag:"SIM", desc:"Tu conseilles des entreprises qui veulent « faire de l'IA ». Cinq demandes : à toi de reconnaître ce qui est faisable, utile ou illusoire."},
notions:[
 ["IA spécialisée (ANI)", "Une IA conçue pour une seule tâche précise", "Un filtre antispam ou une enceinte connectée"],
 ["IA générale (AGI)", "Une IA capable de toutes les tâches intellectuelles d'un humain", "Elle n'existe pas encore"],
 ["Apprentissage supervisé", "Apprendre à associer une entrée A à une sortie B à partir d'exemples", "Une photo de la route en entrée, la position des voitures en sortie"],

 ["Data science", "Tirer des données des conclusions pour aider à décider", "Un diaporama : rénover fait gagner 15 %"],
 ["Réseau de neurones", "Un empilement de petits calculs appelés neurones artificiels", "Prix, port et marketing en entrée, demande en sortie"],
 ["Deep learning", "Du machine learning avec des réseaux de neurones à nombreuses couches", "La reconnaissance faciale d'un téléphone"],
 ["Neurone artificiel", "Une brique de calcul simple, comme un Lego", "Il relie le prix d'un t-shirt à la demande"],
 ["Pixel", "Un point d'image codé par des nombres de luminosité", "Trois valeurs par pixel en couleur : rouge, vert, bleu"],
 ["Entrepôt de données unifié", "Toutes les données de l'entreprise réunies au même endroit", "Les ventes et les réclamations analysables ensemble"],
 ["Acquisition stratégique de données", "Collecter dès aujourd'hui les données utiles à long terme", "Un service gratuit qui fournit des données"],
 ["Test A/B", "Comparer deux versions pour garder celle qui marche le mieux", "Bouton rouge contre bouton vert"],
 ["Règle de la seconde", "Ce qu'un humain fait en une seconde, l'IA peut souvent l'apprendre", "Dire si une personne sourit"],
 ["Robustesse", "Garder ses performances quand les données changent", "Radiographies d'un autre appareil"]
],
vf:[
 ["Un filtre antispam est un exemple d'IA générale.",false,"C'est une IA spécialisée (ANI) : une seule tâche."],
 ["L'IA générale (AGI) existe déjà dans certains laboratoires.",false,"Les progrès de l'IA spécialisée ne signifient pas que l'AGI soit là."],
 ["L'apprentissage supervisé associe une entrée A à une sortie B.",true,"C'est la technique qui crée le plus de valeur aujourd'hui."],
 ["Avec beaucoup de données, un petit réseau égale toujours un grand réseau.",false,"Un petit réseau plafonne ; un grand réseau continue de progresser."],
 ["Seul l'étiquetage manuel permet d'obtenir des données.",false,"On peut aussi observer des comportements ou utiliser des données existantes."],
 ["Une photo est une donnée non structurée.",true,"Images, sons et texte libre sont non structurés."],
 ["Un tableau des ventes est une donnée non structurée.",false,"Des lignes et des colonnes : c'est structuré."],
 ["La data science livre souvent des conclusions sous forme de diaporama.",true,"Son but est d'aider des humains à décider."],
 ["Le machine learning et la data science livrent exactement la même chose.",false,"ML = logiciel qui tourne ; data science = conclusions pour décider."],
 ["Le deep learning est une partie du machine learning.",true,"Et le machine learning est une partie de l'IA."],
 ["Tous les algorithmes d'IA sont du deep learning.",false,"C'est l'inverse : le deep learning n'est qu'une partie de l'IA."],
 ["« Deep learning » et « réseau de neurones » sont presque synonymes.",true,"Les deux termes s'emploient aujourd'hui de façon interchangeable."],
 ["Un réseau de neurones fonctionne comme un cerveau biologique.",false,"Le lien est très vague : c'est un calcul mathématique."],
 ["Un magasin qui ouvre un site web devient une entreprise Internet.",false,"Il faut changer sa façon de travailler, pas seulement ajouter un outil."],
 ["Une entreprise d'IA réunit ses données dans un entrepôt unifié.",true,"Des données éparpillées entre services sont difficiles à exploiter."],
 ["Dire si une personne sourit est une tâche probablement faisable pour l'IA.",true,"Un humain le fait en une seconde, et les photos étiquetées ne manquent pas."],
 ["Écrire seule un rapport de marché de 50 pages est facile pour l'IA actuelle.",false,"C'est une tâche longue et complexe, hors de portée aujourd'hui."],
 ["10 000 vidéos suffisent pour comprendre tous les gestes humains.",false,"Les gestes sont trop variés : le cours conclut que cela ne suffit pas."],
 ["Une IA reste fiable sur des données très différentes de son entraînement.",false,"Elle est peu robuste : ses performances chutent."],
 ["L'IA apprend aussi bien qu'un médecin avec 10 images et un manuel.",false,"Elle a besoin de milliers d'exemples étiquetés."],
 ["Pour un ordinateur, une image est une grille de nombres.",true,"Une valeur de luminosité par pixel, trois en couleur."],
 ["Les premières couches d'un réseau de vision détectent les contours.",true,"Puis les parties du visage, puis le visage entier."],

],
sc:[
 {t:"Le patron enthousiaste", c:"ANI ou AGI", q:"Un PDG veut « une IA qui gère toute l'entreprise comme un humain, d'ici six mois ».", facts:[["Délai", "6 mois"], ["Données", "ventes, e-mails"]],
  lesson:"L'IA d'aujourd'hui est spécialisée : elle excelle sur une tâche précise. Une IA qui ferait tout comme un humain, c'est l'AGI, qui n'existe pas. La bonne réponse est de proposer des tâches précises, comme trier les e-mails clients.",
  nodes:{a:{x:"Il est prêt à signer un gros budget dès demain.", ch:[

   {l:"Accepter et promettre l'IA générale", f:()=>({d:0,r:"Six mois plus tard, rien ne fonctionne comme promis. Le budget est brûlé et l'IA perd sa crédibilité dans l'entreprise."})},
   {l:"Proposer une tâche précise : trier les e-mails clients", f:()=>({d:0,r:"Le tri automatique marche en quelques mois. Le PDG voit un résultat concret et demande la suite."})}]}}},
 {t:"Le sourire du client", c:"La règle de la seconde", q:"Une chaîne de magasins veut savoir si les clients sourient en sortant, à partir des images d'une caméra.", facts:[["Photos étiquetées", "50 000"], ["Tâche humaine", "< 1 s"]],
  lesson:"Une tâche qu'un humain fait en une seconde, avec beaucoup d'exemples étiquetés, est un bon candidat pour l'apprentissage supervisé. (Dans la vraie vie, il faudrait aussi vérifier que filmer et analyser les clients respecte la loi et leur consentement.)",
  nodes:{a:{x:"Tu as déjà 50 000 photos de visages étiquetées « sourire » ou « pas sourire ».", ch:[

   {l:"Impossible : l'IA ne comprend pas les émotions", f:()=>({d:0,r:"Trop pessimiste. Reconnaître un sourire est une tâche visuelle simple, pas une compréhension profonde des émotions."})}]}}},
 {t:"La réponse aux réclamations", c:"Limites de l'IA", q:"Un site de jouets veut une IA qui écrive seule des réponses chaleureuses et personnalisées aux clients mécontents.", facts:[["Exemples de réponses", "1 000"], ["Ton attendu", "empathique"]],

   {l:"Lancer la génération automatique des réponses", f:()=>({d:0,r:"L'IA produit des formules génériques, parfois hors sujet. Un client dont le cadeau est arrivé trop tard reçoit « Merci pour votre e-mail »."})}]}}},
 {t:"Le nouvel hôpital", c:"Robustesse aux données", q:"Un modèle qui détecte la pneumonie, entraîné dans un grand centre médical, doit être installé dans un petit hôpital aux appareils plus anciens.", facts:[["Précision au centre", "95 %"], ["Appareils", "plus anciens"]],

 {t:"L'appli des t-shirts", c:"Réseau de neurones et données", q:"Ton site de t-shirts veut prédire la demande. Ton associé veut écrire lui-même les règles : « si le port dépasse 5 €, la demande baisse de 20 % »…", facts:[["Historique", "3 ans de ventes"], ["Facteurs", "prix, port, pub, matière"]],

let AC=null, SOUND=true;
try{ SOUND = localStorage.getItem("arcade-son")!=="0"; }catch(e){}
function beep(f,d,type,when){ if(!SOUND) return; try{ AC=AC||new (window.AudioContext||window.webkitAudioContext)(); const t=AC.currentTime+(when||0);
  const o=AC.createOscillator(), g=AC.createGain(); o.type=type||"sine"; o.frequency.setValueAtTime(f,t);
  g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(.18,t+.01); g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g).connect(AC.destination); o.start(t); o.stop(t+d+.02); }catch(e){} }
const sGood=()=>{ beep(660,.12); beep(990,.16,"sine",.09); };
const sBad =()=>{ beep(220,.25,"triangle"); };
const sWin =()=>{ [523,659,784,1046].forEach((f,i)=>beep(f,.18,"sine",i*.11)); };

const KEY="arcade-ia-v1", app=document.getElementById("app");
let S;
function load(){ try{ return JSON.parse(localStorage.getItem(KEY))||{}; }catch(e){ return {}; } }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S.best)); }catch(e){} syncArcade(); }
// ---- Classement de la communauté : envoi de la note /20 de chaque session (si connecté) ----
const ARC = {me:null, sent:{}};
async function syncArcade(){
  if(!window.CDQ || !CDQ.sb || !ARC.me || !ARC.me.pseudo || !S) return;
  for(const d of SESSIONS){ const b=S.best[d.id]; const n=b?sessNote(b):null;
    if(n==null || ARC.sent[d.id]>=n) continue;
    try{ const {error}=await CDQ.sb.rpc("submit_arcade",{p_session:d.id,p_note:n}); if(!error) ARC.sent[d.id]=n; }catch(e){} }
}
function shuffle(n){ const a=[...Array(n).keys()]; for(let i=n-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
const sgn = d => (d>0?"+":d<0?"−":"±")+Math.abs(d)+" $";
const fmtT = t => { const s=Math.floor(t); return Math.floor(s/60)+":"+String(s%60).padStart(2,"0"); };
const D = () => SESSIONS[S.s];
const B = () => (S.best[D().id] = S.best[D().id] || {});

function start(data){
  S = Object.assign({view:"home", prev:"home", s:0, best:load(), vf:null, as:null, pq:null}, data && data.S ? data.S : {});
  render();
}
function render(){
  const inS = S.view!=="home";
  document.getElementById("fbtn").hidden = !inS || S.view==="fiches" || S.view==="cours" || S.view==="hub";
  document.getElementById("crumb").textContent = inS ? "← Session "+D().n+" · "+D().short : "Arcade-IA";
  document.getElementById("crumb").dataset.act = inS && S.view!=="hub" ? "hub" : "home";
  document.getElementById("sbtn").textContent = "Son : "+(SOUND?"oui":"non");
  ({home:vHome, hub:vHub, vf:vVF, vfEnd:vVFEnd, as:vAS, asEnd:vASEnd, pq:vPQ, pqEnd:vPQEnd, fiches:vFiches, cours:vCours})[S.view]();
}

function vHome(){
  app.innerHTML = `
  <header class="stack"><h1>Arcade-<span style="color:var(--accent)">IA</span></h1>
  <p class="muted">Une évaluation par session : d'abord le cours, puis les tests notés — un simulateur, un Vrai ou Faux chronométré et un jeu de paires, avec les fiches de révision toujours à portée de main.</p></header>
  <div class="sess">${SESSIONS.map((s,i)=>{ const b=S.best[s.id]||{}; const done=[b.note,b.vfn2,b.as].filter(x=>x!=null).length, sn=sessNote(b);
    return `<button class="scard" data-act="open" data-i="${i}"><span class="num">${s.n}</span><span class="tx"><b>${s.short}</b><span class="muted small">${s.sim.name} · Vrai ou Faux · Paires</span></span>
    ${sn!=null?`<span class="mono" style="font-weight:700;color:var(--gold)">${fmtN(sn)} / 20</span>`:`<span class="dots" aria-label="${done} test(s) sur 3 déjà notés">${[0,1,2].map(k=>`<i class="${k<done?"on":""}"></i>`).join("")}</span>`}</button>`; }).join("")}</div>
  <p class="muted small">Évaluation pédagogique notée sur 20, aucun conseil en investissement. Tes records restent sur cet appareil${ARC.me&&ARC.me.pseudo?` et ta meilleure note de chaque session part au <a href="https://tokenforgefan.github.io/chaine-des-quiz/#classement?onglet=arcade">classement Arcade</a>`:` · <a href="${window.CDQ?CDQ.loginUrl():"#"}">Connecte-toi</a> pour entrer dans le classement`}.</p>`;
}

function sessBox(){
  const b=B(), n=sessNote(b);
  const parts=[[D().sim.name,b.note],["Vrai ou Faux",b.vfn2],["Les Paires",b.as!=null?noteAS(b.as):null]];
  return `<div class="fb ${n==null?"ne":n>=10?"ok":"ko"}"><span class="res">Note de la session ${D().n} : ${n==null?"à compléter":fmtN(n)+" / 20 · "+mention(n)}</span>
  <span class="small">${parts.map(x=>x[0]+" "+(x[1]==null?"—":fmtN(x[1])+"/20")).join(" · ")}${n==null?" — joue les 3 tests pour l'obtenir.":" — moyenne de tes meilleures notes."}</span></div>`;
}
function vHub(){
  const s=D(), b=B();
  app.innerHTML = `
  <header class="stack"><span class="eyebrow">Session ${s.n}</span><h1>${s.title}</h1></header>${b.cours?sessBox():""}
  <button class="game" data-act="cours"><span class="tag d">1 · COURS</span><span class="g"><b>${b.cours?"Revoir le cours":"Commencer par le cours"}</b><span class="muted">Les ${s.notions.length} notions clés de la session, avec un exemple pour chacune. À lire avant les tests.</span></span><span class="rec">Statut<b>${b.cours?"Lu":"À lire"}</b></span></button>
  <p class="eyebrow" style="margin-top:8px">2 · Tests ${b.cours?"":"(verrouillés tant que le cours n'est pas lu)"} · chaque mauvaise réponse te pénalise</p>
  <button class="game" data-act="pqStart" ${b.cours?"":"disabled"}><span class="tag a">${s.sim.tag}</span><span class="g"><b>${s.sim.name}</b><span class="muted">${s.sim.desc}</span></span>
    <span class="rec">Meilleure note<b>${b.note!=null? fmtN(b.note)+" / 20":"—"}</b></span></button>
  <button class="game" data-act="vfStart" ${b.cours?"":"disabled"}><span class="tag c">60 s</span><span class="g"><b>Vrai ou Faux éclair</b><span class="muted">Un maximum d'affirmations en une minute. Noté sur 20 : il faut au moins 20 réponses justes sans faute pour 20/20. Chaque erreur annule une bonne réponse.</span></span>
    <span class="rec">Meilleure note<b>${b.vfn2!=null? fmtN(b.vfn2)+" / 20":"—"}</b></span></button>
  <button class="game" data-act="asStart" ${b.cours?"":"disabled"}><span class="tag b">DUO</span><span class="g"><b>Les Paires</b><span class="muted">Relie chaque mot du cours à sa définition, le plus vite possible. Noté au chrono : 0:50 ou moins = 20/20, puis −1 point par tranche de 10 s. Une erreur coûte 5 secondes.</span></span>
    <span class="rec">Meilleure note<b>${b.as!=null? noteAS(b.as)+" / 20":"—"}</b></span></button>
`;
}

/* ---------- Vrai ou Faux ---------- */
function vfStart(){ S.vf={deck:shuffle(D().vf.length), i:0, t:60, score:0, streak:0, ok:0, n:0, miss:[], wait:false, last:""}; S.view="vf"; }
const mult = () => Math.min(4, 1+Math.floor(S.vf.streak/3));
function vVF(){
  const g=S.vf, st=D().vf[g.deck[g.i]];
  app.innerHTML = `
  <div class="bar"><div class="hud"><span>Temps <b id="vt">${Math.ceil(g.t)}</b> s</span><span>Score <b>${g.score}</b></span><span class="muted">Série <b>${g.streak}</b> · ×${mult()}</span></div>
  <button class="link" data-act="hub">Quitter</button></div>
  <div class="prog"><i id="vb" style="width:${g.t/60*100}%"></i></div>
  <div class="card">${st[0]}</div>
  ${g.wait ? `<div class="fb ko" role="status"><span class="res">Raté (−5 points) · c'était ${st[1]?"VRAI":"FAUX"}</span><span>${st[2]}</span></div>
     <button class="btn" data-act="vfNext" id="go">Continuer</button><p class="muted small">Le chrono est en pause pendant que tu lis.</p>`
   : `<div class="vf"><button class="f" data-act="vfAns" data-v="0">FAUX</button><button class="v" data-act="vfAns" data-v="1">VRAI</button></div>
     <p class="muted small">${g.last || "Au clavier : flèche gauche pour FAUX, flèche droite pour VRAI."}</p>`}`;
  if(g.wait) document.getElementById("go").focus({preventScroll:true});
}
function vfAns(v){
  const g=S.vf, st=D().vf[g.deck[g.i]]; g.n++;
  if(v===st[1]){ sGood(); const p=10*mult(); g.score+=p; g.streak++; g.ok++; g.last="Juste, +"+p+" points."; vfAdvance(); }
  else { sBad(); g.score-=5; g.streak=0; g.miss.push(g.deck[g.i]); g.wait=true; }
}
function vfAdvance(){ const g=S.vf; g.wait=false; g.i++; if(g.i>=g.deck.length) vfEnd(); }
function vfEnd(){ sWin(); const g=S.vf, b=B(); g.note=noteVF(g.ok,g.n-g.ok); g.rec = b.vfn2==null || g.note>b.vfn2; if(g.rec) b.vfn2=g.note; if(b.vf==null || g.score>b.vf) b.vf=g.score; save(); S.view="vfEnd"; }
function vVFEnd(){
  const g=S.vf, V=D().vf;
  app.innerHTML = `
  <section class="panel"><span class="eyebrow">Vrai ou Faux éclair · terminé</span>
  <div class="row"><div><div class="big">${fmtN(g.note)}<span class="muted" style="font-size:1.2rem"> / 20</span></div><span class="muted">ta note</span></div><div><div class="big">${g.ok} / ${g.n}</div><span class="muted">bonnes réponses</span></div><div><div class="big">${g.score}</div><span class="muted">points</span></div></div>
  <p>${g.rec ? "C'est ta meilleure note." : "Meilleure note : "+fmtN(B().vfn)+" / 20."} Barème : (bonnes réponses − erreurs) ÷ réponses données × 20, avec au moins 20 réponses attendues. 20 justes sans faute = 20/20 ; 15 justes sans faute = 15/20.</p>${sessBox()}
  <div class="bar" style="justify-content:flex-start"><button class="btn" data-act="vfStart">Rejouer</button><button class="link" data-act="hub">Autres jeux de la session</button></div></section>
  ${g.miss.length ? `<section class="panel"><h3>À revoir</h3>${g.miss.map(i=>`<div class="miss"><b>${V[i][0]}</b><span><span class="${V[i][1]?"oui":"non"}">${V[i][1]?"Vrai":"Faux"}.</span> ${V[i][2]}</span></div>`).join("")}</section>`:""}`;
}

/* ---------- Les Paires ---------- */
function asStart(){ const N=D().notions.length, R=Math.min(3,Math.floor(N/5));
  S.as={pool:shuffle(N).slice(0,R*5), R, r:0, t:0, err:0, sel:null, done:[], bad:null, ex:"", defs:[]}; asRound(); S.view="as"; }
function asRound(){ const g=S.as, ids=g.pool.slice(g.r*5, g.r*5+5); g.terms=ids; g.defs=shuffle(5).map(k=>ids[k]); g.done=[]; g.sel=null; g.bad=null; }
function vAS(){
  const g=S.as, N=D().notions;
  app.innerHTML = `
  <div class="bar"><div class="hud"><span>Manche <b>${g.r+1}</b> / ${g.R}</span><span>Chrono <b id="at">${fmtT(g.t)}</b></span><span class="muted">Erreurs <b>${g.err}</b></span></div>
  <button class="link" data-act="hub">Quitter</button></div>
  <p class="muted small">Choisis un mot, puis touche sa définition.</p>
  <div class="chips">${g.terms.map(i=>`<button class="chip" data-act="asTerm" data-i="${i}" aria-pressed="${g.sel===i}" ${g.done.includes(i)?"disabled":""}>${N[i][0]}</button>`).join("")}</div>
  <div class="stack" style="gap:8px">${g.defs.map(i=> g.done.includes(i)
     ? `<div class="def done"><b>${N[i][0]}</b> · ${N[i][1]}</div>`
     : `<button class="def ${g.bad===i?"bad":""}" data-act="asDef" data-i="${i}">${N[i][1]}</button>`).join("")}</div>
  <p class="small" role="status">${g.ex}</p>`;
}
function asDef(i){
  const g=S.as, N=D().notions; g.bad=null;
  if(g.sel==null){ g.ex="Choisis d'abord un mot dans la liste du haut."; return; }
  if(g.sel===i){ sGood(); g.done.push(i); g.sel=null; g.ex="Juste. Exemple : "+N[i][2]+".";
    if(g.done.length===5){ g.r++; if(g.r===g.R){ sWin(); const b=B(); g.rec = b.as==null || Math.round(g.t)<b.as; if(g.rec){ b.as=Math.round(g.t); save(); } S.view="asEnd"; } else asRound(); } }
  else { sBad(); g.err++; g.t+=5; g.bad=i; g.ex="Ce n'est pas ça : 5 secondes de pénalité. Réessaie."; }
}
function vASEnd(){
  const g=S.as, N=D().notions;
  app.innerHTML = `
  <section class="panel"><span class="eyebrow">Les Paires · terminé</span>
  <div class="row"><div><div class="big">${fmtN(noteAS(Math.round(g.t)))}<span class="muted" style="font-size:1.2rem"> / 20</span></div><span class="muted">ta note</span></div><div><div class="big">${fmtT(g.t)}</div><span class="muted">temps final</span></div><div><div class="big">${g.err}</div><span class="muted">erreurs</span></div></div>
  <p>${g.rec ? "C'est ton record." : "Record à battre : "+fmtT(B().as)+" ("+noteAS(B().as)+" / 20)."} Barème : 0:50 ou moins = 20/20, puis 1 point de moins par tranche de 10 s (pénalités comprises). Tu as révisé ${g.pool.length} notions sur ${N.length} : chaque partie en tire d'autres.</p>
  ${sessBox()}<div class="bar" style="justify-content:flex-start"><button class="btn" data-act="asStart">Rejouer</button><button class="link" data-act="hub">Autres jeux de la session</button></div></section>
  <section class="panel"><h3>Les notions de cette partie</h3>${g.pool.map(i=>`<div class="miss"><b>${N[i][0]}</b><span>${N[i][1]}</span><span class="muted">${N[i][2]}</span></div>`).join("")}</section>`;
}

/* ---------- Simulateur ---------- */
function pqStart(){ S.pq={si:0, node:"a", ctx:{}, out:null, hist:[]}; S.view="pq"; }
function panel(sc, nd){
  if(sc.book) return `<div class="mkt"><div class="o">Meilleur acheteur (bid)<b>0,${sc.book[0]} $</b></div><div class="n">Meilleur vendeur (ask)<b>0,${sc.book[1]} $</b></div></div>`;
  const m=nd.m||sc.m;
  if(m) return `<div class="mkt"><div class="o">OUI<b>0,${String(m[0]).padStart(2,"0")} $</b></div><div class="n">NON<b>0,${String(m[1]).padStart(2,"0")} $</b></div></div>`;
  if(sc.facts) return `<div class="mkt">${sc.facts.map(f=>`<div class="z">${f[0]}<b>${f[1]}</b></div>`).join("")}</div>`;
  return "";
}
function vPQ(){
  const g=S.pq, SC=D().sc, sc=SC[g.si], nd=sc.nodes[g.node], pts=g.hist.reduce((a,x)=>a+x.p,0);
  app.innerHTML = `
  <div class="bar"><div class="hud"><span>Situation <b>${g.si+1}</b> / ${SC.length}</span></div><button class="link" data-act="hub">Quitter</button></div>
  <div class="prog"><i style="width:${(g.si+(g.out?1:0))/SC.length*100}%"></i></div>
  <section class="panel"><span class="eyebrow">${sc.t}</span><h2>${sc.q}</h2>${panel(sc,nd)}
  ${g.out ? `<div class="fb ${g.out.p===4?"ok":g.out.p===0?"ko":"ne"}" role="status"><span class="res">${PTS[g.out.p]}</span><span>${g.out.r}</span></div>
      <div class="stack" style="gap:4px"><span class="eyebrow">À retenir · ${sc.c}</span><p>${sc.lesson}</p></div>
      <button class="btn" data-act="pqNext" id="go">${g.si===SC.length-1?"Voir ma note":"Situation suivante"}</button>`
   : `<p>${nd.x}</p><div class="stack" style="gap:8px">${nd.ch.map((c,k)=>`<button class="choice" data-act="pqPick" data-k="${k}">${c.l}${c.s?`<span>${c.s}</span>`:""}</button>`).join("")}</div>`}
  </section>`;
  if(g.out) document.getElementById("go").focus({preventScroll:true});
}
function pqPick(k){
  const g=S.pq, SC=D().sc, sc=SC[g.si], res=sc.nodes[g.node].ch[k].f(g.ctx);
  if(res.to){ g.node=res.to; return; }
  const sco=SCORES[D().id+"-"+g.si+"-"+g.node], p=(sco && sco[k]!=null) ? sco[k] : 0;
  g.out=Object.assign({},res,{p}); (p===4?sGood:p===0?sBad:()=>{})(); g.hist.push({p});
}
function pqNext(){
  const g=S.pq, SC=D().sc;
  if(g.si<SC.length-1){ g.si++; g.node="a"; g.ctx={}; g.out=null; }
  else { sWin(); const b=B(), n=noteOf(g); g.rec = b.note==null || n>b.note; if(g.rec){ b.note=n; save(); } S.view="pqEnd"; }
}
function vPQEnd(){
  const g=S.pq, SC=D().sc, n=noteOf(g), rk = n>=18?"Expert de la session" : n>=14?"Fin analyste" : n>=10?"Joueur prudent" : "Apprenti", best=g.hist.filter(x=>x.p===4).length;
  app.innerHTML = `
  <section class="panel"><span class="eyebrow">${D().sim.name} · bilan</span>
  <div class="row"><div><div class="big">${fmtN(n)}<span class="muted" style="font-size:1.2rem"> / 20</span></div><span class="muted">ta note</span></div><div><h2>${rk}</h2><span class="muted">ton rang</span></div><div><div class="big">${best} / ${SC.length}</div><span class="muted">meilleurs choix</span></div></div>
  <p>${g.rec ? "C'est ton record." : "Record à battre : "+fmtN(B().note)+" / 20."} La note juge tes décisions, pas la chance : un pari qui a payé ne vaut pas un bon choix.</p>${sessBox()}
  ${SC.map((s,i)=>`<div class="line"><span><b>${s.t}</b><br><span class="muted small">${s.c}</span></span><b class="mono ${g.hist[i].p===4?"oui":g.hist[i].p===0?"non":""}">${g.hist[i].p} / 4</b></div>`).join("")}
  <div class="bar" style="justify-content:flex-start"><button class="btn" data-act="pqStart">Rejouer</button><button class="link" data-act="hub">Autres jeux de la session</button></div></section>`;
}

  <p class="muted">Lis chaque notion et son exemple. Ensuite, passe aux tests : chaque mauvaise réponse fait baisser ta note, ton score ou ton temps.</p></header>

/* ---------- Événements ---------- */
document.addEventListener("click", ev=>{
  const b=ev.target.closest("[data-act]"); if(!b || b.disabled) return;
  const a=b.dataset.act;
  if(a==="home") S.view="home";
  else if(a==="open"){ S.s=+b.dataset.i; S.view="hub"; }
  else if(a==="hub") S.view="hub";
  else if(a==="snd"){ SOUND=!SOUND; try{localStorage.setItem("arcade-son",SOUND?"1":"0")}catch(e){} }
  else if(a==="fiches"){ S.prev=S.view; S.view="fiches"; }
  else if(a==="back") S.view=S.prev;
  else if(a==="cours") S.view="cours";
  else if(a==="coursDone"){ B().cours=true; save(); S.view="hub"; }
  else if(a==="vfStart") vfStart();
  else if(a==="vfAns") vfAns(b.dataset.v==="1");
  else if(a==="vfNext") vfAdvance();
  else if(a==="asStart") asStart();
  else if(a==="asTerm"){ S.as.sel=+b.dataset.i; S.as.bad=null; }
  else if(a==="asDef") asDef(+b.dataset.i);
  else if(a==="pqStart") pqStart();
  else if(a==="pqPick") pqPick(+b.dataset.k);
  else if(a==="pqNext") pqNext();
  render();
  if(/Start|home|open|hub|fiches|back|pqNext|cours/.test(a)) window.scrollTo(0,0);
});
document.addEventListener("keydown", ev=>{
  if(!S || S.view!=="vf" || S.vf.wait) return;
  if(ev.key==="ArrowLeft"){ vfAns(false); render(); }
  else if(ev.key==="ArrowRight"){ vfAns(true); render(); }
});
setInterval(()=>{
  if(!S) return;
  if(S.view==="vf" && !S.vf.wait){
    S.vf.t-=.1;
    if(S.vf.t<=0){ S.vf.t=0; vfEnd(); render(); return; }
    const t=document.getElementById("vt"), bar=document.getElementById("vb");
    if(t) t.textContent=Math.ceil(S.vf.t); if(bar) bar.style.width=(S.vf.t/60*100)+"%";
  } else if(S.view==="as"){
    S.as.t+=.1; const t=document.getElementById("at"); if(t) t.textContent=fmtT(S.as.t);
  }
